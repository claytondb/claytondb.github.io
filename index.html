<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>David Clayton</title>
<style>
  :root{
    --bg:#f5f6f8; --fg:#15181d; --dim:#5c6472; --card:#fff;
    --line:#e2e6eb; --accent:#2f6fd0;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1115; --fg:#e8ecf2; --dim:#98a1b0; --card:#171a20;
      --line:#262b33; --accent:#7fabf2;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{max-width:34rem; margin:0 auto; padding-block:14vh 8vh}
  h1{font-size:1.55rem; margin:0 0 .35rem; letter-spacing:-.015em}
  .lede{color:var(--dim); margin:0 0 2.75rem}
  h2{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--dim); margin:0 0 .8rem; font-weight:600;
  }
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:1.15rem 1.25rem;
  }
  .card h3{margin:0 0 .35rem; font-size:1.05rem}
  .card p{margin:0 0 1rem; color:var(--dim); font-size:.94rem}
  a{color:var(--accent)}
  .links a{margin-right:1.15rem; font-size:.9rem; white-space:nowrap}
  footer{margin-top:3.25rem; color:var(--dim); font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>David Clayton</h1>
  <p class="lede">I make small games for iPhone.</p>

  <h2>Apps</h2>
  <div class="card">
    <h3>Jumpy Friend</h3>
    <p>An endless vertical climb. Hold to charge a jump, release to leap &mdash; hold longer, jump higher.</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6808296798">App&nbsp;Store</a>
      <a href="/jumpy-friend/privacy-policy.html">Privacy&nbsp;policy</a>
      <a href="mailto:jumpyfriendgame@gmail.com">Support</a>
    </div>
  </div>

  <footer>jumpyfriendgame@gmail.com</footer>
</main>
</body>
</html>
